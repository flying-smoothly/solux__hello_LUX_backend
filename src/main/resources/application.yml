spring:
  application:
    name: hello_lux_quiz

  profiles:
    include: secret

  # 0. 파일 업로드(Multipart) 크기 제한 설정
  #    - 미설정 시 Tomcat 기본값(1MB)이 적용되어 사진 업로드 시 MaxUploadSizeExceededException 발생
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 1. 데이터베이스 연결 설정
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://altaria.proxy.rlwy.net:59149/eum_db?sslMode=REQUIRED&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul}
    username: ${DB_USERNAME:eum_app}
    password: ${DB_PASSWORD:1234}

  # 2. JPA/Hibernate 설정 (테이블 자동 생성 및 SQL 로그 확인)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false # 수정된 부분 (들여쓰기 확인)

# authentication 브랜치 통합: JWT 설정
jwt:
  # Base64 encoded secret key (256-bit 이상). 운영 환경에서는 반드시 override.
  secret: ${JWT_SECRET:c29sdXhXZWIyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ011c3RCZUxvbmdFbm91Z2gxMjM0NTY3ODkw}
  # Access token 유효기간(ms, 기본 24h)
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}