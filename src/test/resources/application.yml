spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:shared}
    include: secret

  # DB 접속 정보는 프로파일별 파일(application-local.yml / application-shared.yml)에 있다.
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        # 원격 DB 는 왕복 비용이 크므로 배치로 묶어서 보낸다.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    
# authentication 브랜치 통합: JWT 설정
jwt:
  # Base64 encoded secret key (256-bit 이상). 운영 환경에서는 반드시 override.
  secret: ${JWT_SECRET:c29sdXhXZWIyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ011c3RCZUxvbmdFbm91Z2gxMjM0NTY3ODkw}
  # Access token 유효기간(ms, 기본 24h)
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}