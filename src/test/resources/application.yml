spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    include: secret

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eum_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:c29sdXhXZWIyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ011c3RCZUxvbmdFbm91Z2gxMjM0NTY3ODkw}
  expiration: ${JWT_EXPIRATION:86400000}