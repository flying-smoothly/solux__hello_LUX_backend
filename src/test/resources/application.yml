spring:
  application:
    name: hello_lux_quiz
  config:
    import: optional:file:.env[.properties]

  profiles:
    include: secret

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false

  # 마이그레이션은 MySQL 문법(ENGINE=InnoDB 등)이라 H2 에서 돌지 않는다.
  # 스키마는 위의 ddl-auto 가 만든다.
  flyway:
    enabled: false
jwt:
  secret: ${JWT_SECRET:c29sdXhXZWIyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ011c3RCZUxvbmdFbm91Z2gxMjM0NTY3ODkw}
  expiration: ${JWT_EXPIRATION:86400000}

# R2Config 는 부팅 시점에 자격증명을 요구해서, 비어 있으면 컨텍스트가 아예 뜨지 않는다.
R2_ACCOUNT_ID: test-account
R2_ACCESS_KEY_ID: test-access-key
R2_SECRET_ACCESS_KEY: test-secret-key
R2_BUCKET_NAME: test-bucket
R2_PUBLIC_URL: http://localhost/r2