plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.eum'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // authentication 브랜치 통합: 보안/검증
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'

    // authentication 브랜치 통합: JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	
	//아마존
	implementation 'software.amazon.awssdk:s3:2.20.26'

    // 공유 DB 스키마 관리: Flyway 마이그레이션
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // local/test 프로파일용 (MySQL 없이 실행)
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}


tasks.named('test') {
	useJUnitPlatform()
}

// .env 를 bootRun 의 환경변수로 주입한다.
// Spring Boot 도 Gradle 도 .env 를 자동으로 읽지 않기 때문에, 파일만 만들어 두면
// DB_URL / R2_* 같은 값이 어디에도 전달되지 않는다.
// 이미 셸에 설정된 환경변수가 있으면 그쪽이 우선한다.
def loadDotEnv = { File envFile ->
	Map<String, String> values = [:]
	if (!envFile.exists()) {
		return values
	}
	envFile.eachLine('UTF-8') { String line ->
		String trimmed = line.trim()
		if (trimmed.isEmpty() || trimmed.startsWith('#')) {
			return
		}
		if (trimmed.startsWith('export ')) {
			trimmed = trimmed.substring('export '.length()).trim()
		}
		int separator = trimmed.indexOf('=')
		if (separator <= 0) {
			return
		}
		String key = trimmed.substring(0, separator).trim()
		String value = trimmed.substring(separator + 1).trim()
		if (value.length() >= 2 &&
				((value.startsWith('"') && value.endsWith('"')) ||
				 (value.startsWith("'") && value.endsWith("'")))) {
			value = value.substring(1, value.length() - 1)
		}
		if (System.getenv(key) == null) {
			values[key] = value
		}
	}
	return values
}

tasks.named('bootRun') {
	environment loadDotEnv(project.file('.env'))
}
